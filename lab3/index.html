<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пекур Р.О., ІМ-44, Лаб 3, Вар 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Варіант 1 - Float</h1>

<main class="float-layout">
    <section class="float-row first-row">
        <div class="float-image">
            <img src="https://img.magnific.com/free-psd/luxurious-golden-number-1-transparent-background_84443-65759.jpg?semt=ais_hybrid&w=740&q=80" alt="Перше зображення">
        </div>
        <div class="float-text">
            <h2>Заголовок</h2>
            <p>Текст першого блоку.</p>
        </div>
    </section>

    <section class="float-row second-row">
        <p>Текст другого блоку.</p>
    </section>

    <section class="float-row third-row">
        <img src="https://cdn.pixabay.com/photo/2017/02/09/13/51/number-2052150_1280.png" alt="Друге зображення">
    </section>
</main>

<h1>Варіант 2 - Flexbox</h1>

<main class="flex-layout">
    <section class="flex-row first-row">
        <div class="flex-image">
            <img src="https://img.magnific.com/free-psd/luxurious-golden-number-1-transparent-background_84443-65759.jpg?semt=ais_hybrid&w=740&q=80" alt="Перше зображення">
        </div>
        <div class="flex-text">
            <h2>Заголовок</h2>
            <p>Текст першого блоку.</p>
        </div>
    </section>

    <section class="flex-row second-row">
        <p>Текст другого блоку.</p>
    </section>

    <section class="flex-row third-row">
        <img src="https://cdn.pixabay.com/photo/2017/02/09/13/51/number-2052150_1280.png" alt="Друге зображення">
    </section>
</main>

</body>
</html>
