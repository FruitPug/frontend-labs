<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пекур Р.О., ІМ-44, Лаб 1, Вар 2</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .info-table {
            width: 100%;
            max-width: 700px;
            border-collapse: collapse;
            text-align: center;
            margin-bottom: 40px;
        }

        .info-table td {
            border: 2px solid;
            padding: 14px 10px;
        }

        .name-row {
            background-color: #028f8f;
            color: #380000;
            transition: background-color 0.3s, color 0.3s;
        }

        .details-row {
            background-color: #f5f502;
            color: #380000;
            transition: background-color 0.3s, color 0.3s;
        }

        .name-row:hover {
            background-color: #f5f502;
            color: #380000;
        }

        .details-row:hover {
            background-color: #028f8f;
            color: #380000;
        }
    </style>
</head>
<body>

<h1>Завдання 1. HTML-таблиця</h1>

<table class="info-table">
    <tr class="name-row">
        <td rowspan="3">Пекур</td>
        <td>Роман</td>
        <td rowspan="3">Олександрович</td>
        <td></td>
    </tr>
    <tr class="details-row">
        <td>ІМ-44</td>
        <td>ЛР-2 Варіант 2</td>
    </tr>
    <tr>
        <td></td>
        <td></td>
    </tr>
    <tr>
        <td></td>
        <td colspan="2"></td>
        <td></td>
    </tr>
</table>

<h1>Завдання 2. CSS Transform</h1>

<div class="red-square" role="img">
    <span class="plus"></span>
</div>

</body>
</html>
